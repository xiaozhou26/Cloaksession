name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Require a matching version tag
        env:
          REF_TYPE: ${{ github.ref_type }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          test "$REF_TYPE" = tag || { echo 'Run releases from a v* tag, not a branch.'; exit 1; }
          python scripts/build.py --check-version --tag "$RELEASE_TAG"

  build:
    needs: verify
    uses: ./.github/workflows/build.yml
    with:
      package: true
      tag: ${{ github.ref_name }}

  publish:
    needs: [verify, build]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true
      - name: Verify all platforms and publish once
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          version="${RELEASE_TAG#v}"
          assets=(
            "release-assets/Cloaksession-${version}-windows-amd64-setup.exe"
            "release-assets/Cloaksession-${version}-macos-universal.zip"
            "release-assets/Cloaksession-${version}-linux-amd64.tar.gz"
          )
          for asset in "${assets[@]}"; do test -s "$asset"; done
          (cd release-assets && sha256sum * > SHA256SUMS.txt)
          gh release create "$RELEASE_TAG" "${assets[@]}" release-assets/SHA256SUMS.txt \
            --verify-tag --title "Cloaksession $RELEASE_TAG" --generate-notes
