name: build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_call:
    inputs:
      package:
        type: boolean
        default: false
      tag:
        type: string
        default: ''

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            desktop/frontend/package-lock.json
            desktop/resources/playwright/package-lock.json
            desktop/resources/reverse/package-lock.json
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.12'
          cache-dependency-path: desktop/go.sum
      - name: Verify application and Wails versions
        run: python scripts/build.py --check-version
      - name: Install Linux dependencies (Wails WebKitGTK 4.0)
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libgtk-3-dev libwebkit2gtk-4.0-dev libssl-dev
      - name: Install frontend dependencies
        working-directory: desktop/frontend
        run: npm ci --legacy-peer-deps
      - name: Install direct Playwright bridge dependencies
        working-directory: desktop/resources/playwright
        run: npm ci
      - name: Install reverse MCP dependencies without optional browsers
        working-directory: desktop/resources/reverse
        run: npm ci --omit=dev --omit=optional
      - name: Test reverse bridge and real MCP tools list (no browser)
        working-directory: desktop/resources/reverse
        run: npm test
      - name: Test build and packaging helpers
        run: python -m unittest discover -s scripts -p 'test_*.py'
      - name: Test direct Playwright browser bridge
        working-directory: desktop/resources/playwright
        run: npm test
      - name: Test frontend fingerprint catalog
        working-directory: desktop/frontend
        run: node --experimental-strip-types src/lib/chromixFingerprint.test.mjs
      - name: Build frontend
        working-directory: desktop/frontend
        run: npm run build
      - name: Test Go backend with race detector
        working-directory: desktop
        run: go test -race -count=1 -mod=readonly -v ./...
      - name: Install Chrome for browser tests
        working-directory: desktop/frontend
        run: npx playwright install --with-deps chrome
      - name: Test real Go browser lifecycle in Chrome
        working-directory: desktop
        run: |
          export CLOAKSESSION_TEST_BROWSER="$(command -v google-chrome)"
          test -x "$CLOAKSESSION_TEST_BROWSER"
          go test -race -count=1 -mod=readonly -v -run '^TestServiceRealBrowser$' .
      - name: Test reverse debugger against real Chrome
        working-directory: desktop
        run: |
          export CLOAKSESSION_TEST_REVERSE_BROWSER="$(command -v google-chrome)"
          test -x "$CLOAKSESSION_TEST_REVERSE_BROWSER"
          go test -race -count=1 -mod=readonly -v -run '^TestReverseIntegration$' .
      - name: Test frontend in Chromium
        working-directory: desktop/frontend
        run: npx playwright test --config playwright.config.ts

  desktop-build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            platform: linux-amd64
            args: ''
          - os: macos-latest
            platform: macos-universal
            args: --universal
          - os: windows-latest
            platform: windows-amd64
            args: ''
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            desktop/frontend/package-lock.json
            desktop/resources/playwright/package-lock.json
            desktop/resources/reverse/package-lock.json
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.12'
          cache-dependency-path: desktop/go.sum
      - name: Install Linux dependencies (Wails WebKitGTK 4.0)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libgtk-3-dev libwebkit2gtk-4.0-dev libssl-dev
      - name: Install NSIS
        if: runner.os == 'Windows' && inputs.package
        run: choco install nsis --no-progress -y
      - name: Verify release tag
        if: inputs.package
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: python scripts/build.py --check-version --tag "$RELEASE_TAG"
        shell: bash
      - name: Build Wails application and stage complete runtime
        if: ${{ !inputs.package }}
        run: python scripts/build.py ${{ matrix.args }}
      - name: Build release package
        if: inputs.package
        run: python scripts/build.py --package ${{ matrix.args }}
      - name: Verify Windows installer contains reverse runtime
        if: runner.os == 'Windows' && inputs.package
        shell: pwsh
        run: |
          $installer = Get-ChildItem desktop/build/dist/*-setup.exe | Select-Object -First 1
          $entries = & 7z l -slt $installer.FullName
          if ($LASTEXITCODE -ne 0) { throw 'Installer listing failed' }
          $text = $entries -join "`n"
          foreach ($path in @('resources\reverse\bridge.mjs', 'resources\reverse\windows.mjs', 'resources\reverse\node_modules\js-reverse-mcp\package.json', 'resources\reverse\node_modules\@zhizhuodemao\patchright-core\package.json')) {
            if (-not $text.Contains($path)) { throw "Installer missing $path" }
          }
      - name: Test Go desktop on target platform
        working-directory: desktop
        run: go test -count=1 -mod=readonly ./...
      - name: Upload release package
        if: inputs.package
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.platform }}
          path: |
            desktop/build/dist/*-setup.exe
            desktop/build/dist/*-macos-universal.zip
            desktop/build/dist/*-linux-amd64.tar.gz
          if-no-files-found: error
          retention-days: 7
