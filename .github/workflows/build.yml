name: build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_call:
    inputs:
      package:
        type: boolean
        default: false
      tag:
        type: string
        default: ''

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            desktop/frontend/package-lock.json
            crates/desktop-core/resources/chromix/package-lock.json
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.12'
          cache-dependency-path: desktop/go.sum
      - name: Verify application and Wails versions
        run: python scripts/build.py --check-version
      - name: Install Linux dependencies (Wails WebKitGTK 4.0)
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libgtk-3-dev libwebkit2gtk-4.0-dev libssl-dev
      - name: Install frontend dependencies
        working-directory: desktop/frontend
        run: npm ci --legacy-peer-deps
      - name: Install direct Playwright bridge dependencies
        working-directory: crates/desktop-core/resources/chromix
        run: npm ci
      - name: Test build and packaging helpers
        run: python -m unittest discover -s scripts -p 'test_*.py'
      - name: Test Rust workspace
        run: cargo test --workspace --locked
      - name: Test Chromix browser bridge
        working-directory: crates/desktop-core/resources/chromix
        run: npm test
      - name: Test frontend fingerprint catalog
        working-directory: desktop/frontend
        run: node --experimental-strip-types src/lib/chromixFingerprint.test.mjs
      - name: Build frontend
        working-directory: desktop/frontend
        run: npm run build
      - name: Build Rust sidecar for Go integration
        run: cargo build --locked -p desktop-core
      - name: Test Go desktop and real Rust sidecar with race detector
        working-directory: desktop
        env:
          CLOAKSESSION_TEST_CORE: ${{ github.workspace }}/target/debug/desktop-core
          CLOAKSESSION_RESOURCE_DIR: ${{ github.workspace }}/crates/desktop-core/resources
        run: |
          test -x "$CLOAKSESSION_TEST_CORE"
          go test -race -count=1 -mod=readonly -v ./...
      - name: Install Chrome for browser tests
        working-directory: desktop/frontend
        run: npx playwright install --with-deps chrome
      - name: Test frontend in Chromium
        working-directory: desktop/frontend
        run: npx playwright test --config playwright.config.ts

  desktop-build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            platform: linux-amd64
            args: ''
          - os: macos-latest
            platform: macos-universal
            args: --universal
          - os: windows-latest
            platform: windows-amd64
            args: ''
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          key: ${{ matrix.platform }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            desktop/frontend/package-lock.json
            crates/desktop-core/resources/chromix/package-lock.json
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.12'
          cache-dependency-path: desktop/go.sum
      - name: Install Linux dependencies (Wails WebKitGTK 4.0)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libgtk-3-dev libwebkit2gtk-4.0-dev libssl-dev
      - name: Install NSIS
        if: runner.os == 'Windows' && inputs.package
        run: choco install nsis --no-progress -y
      - name: Verify release tag
        if: inputs.package
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: python scripts/build.py --check-version --tag "$RELEASE_TAG"
        shell: bash
      - name: Test backend on target platform
        run: cargo test --workspace --locked
      - name: Build Wails application and stage complete runtime
        if: ${{ !inputs.package }}
        run: python scripts/build.py ${{ matrix.args }}
      - name: Build release package
        if: inputs.package
        run: python scripts/build.py --package ${{ matrix.args }}
      - name: Test Go desktop on target platform
        working-directory: desktop
        run: go test -mod=readonly ./...
      - name: Upload release package
        if: inputs.package
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.platform }}
          path: |
            desktop/build/dist/*-setup.exe
            desktop/build/dist/*-macos-universal.zip
            desktop/build/dist/*-linux-amd64.tar.gz
          if-no-files-found: error
          retention-days: 7
