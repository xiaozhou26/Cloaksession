[package]
name = "tauri-app"
version = "1.1.0"
edition = "2021"

[dependencies]
multizen-core = { path = "../multizen-core" }
profile-manager = { path = "../profile-manager" }
settings-store = { path = "../settings-store" }
browser-launcher = { path = "../browser-launcher" }
cdp-driver = { path = "../cdp-driver" }
mcp-server = { path = "../mcp-server" }
behavioral = { path = "../behavioral" }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
async-trait = "0.1"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
axum = "0.7"
reqwest = { version = "0.12", default-features = false, features = ["json", "socks", "rustls-tls", "stream"] }
futures-util = "0.3"
zip = "2"
base64 = "0.22"
sha2 = "0.10"
aes-gcm = "0.10"
scrypt = "0.11"
rand = "0.8"
percent-encoding = "2"

[dev-dependencies]
tempfile = "3"

[build-dependencies]
tauri-build = { version = "2", features = [] }
