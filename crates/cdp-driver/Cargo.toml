[package]
name = "cdp-driver"
version = "0.1.0"
edition = "2021"

[dependencies]
multizen-core = { path = "../multizen-core" }
browser-launcher = { path = "../browser-launcher" }
behavioral = { path = "../behavioral" }
chromiumoxide = { version = "0.9.1", default-features = false }
tokio = { version = "1", features = ["rt-multi-thread", "time", "sync", "macros"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
tracing = "0.1"
reqwest = { version = "0.12", default-features = false, features = ["json"] }
futures = "0.3"

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
